<form [formGroup]="form" class="experience-form">
    <div formArrayName="experience">
        <div *ngFor="let exp of experienceArray.controls; let i=index" [formGroupName]="i" class="experience-item">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>Experience #{{i + 1}}</mat-card-title>
                    <button mat-icon-button color="warn" (click)="removeExperience(i)" type="button">
                        <mat-icon>delete</mat-icon>
                    </button>
                </mat-card-header>
                <mat-card-content>
                    <div class="row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Company</mat-label>
                            <input matInput formControlName="company" placeholder="Acme Corp">
                            <mat-error *ngIf="exp.get('company')?.invalid">Company is required</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Duration</mat-label>
                            <input matInput formControlName="duration" placeholder="Jan 2020 - Present">
                            <mat-error *ngIf="exp.get('duration')?.invalid">Duration is required</mat-error>
                        </mat-form-field>
                    </div>

                    <div class="row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Role/Title</mat-label>
                            <input matInput formControlName="role" placeholder="Senior Developer">
                            <mat-error *ngIf="exp.get('role')?.invalid">Role is required</mat-error>
                        </mat-form-field>
                    </div>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description" rows="4"
                            placeholder="Led a team of 5 developers..."></textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>
    </div>

    <div class="actions">
        <button mat-stroked-button color="primary" (click)="addExperience()" type="button">
            <mat-icon>add</mat-icon> Add Experience
        </button>
    </div>
</form>
