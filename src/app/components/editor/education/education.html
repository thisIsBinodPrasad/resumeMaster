<form [formGroup]="form" class="education-form">
    <div formArrayName="education">
        <div *ngFor="let edu of educationArray.controls; let i=index" [formGroupName]="i" class="education-item">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>Education #{{i + 1}}</mat-card-title>
                    <button mat-icon-button color="warn" (click)="removeEducation(i)" type="button">
                        <mat-icon>delete</mat-icon>
                    </button>
                </mat-card-header>
                <mat-card-content>
                    <div class="row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Institution</mat-label>
                            <input matInput formControlName="institution" placeholder="University of Technology">
                            <mat-error *ngIf="edu.get('institution')?.invalid">Institution is required</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Year/Duration</mat-label>
                            <input matInput formControlName="year" placeholder="2018 - 2022">
                            <mat-error *ngIf="edu.get('year')?.invalid">Year is required</mat-error>
                        </mat-form-field>
                    </div>

                    <div class="row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Degree</mat-label>
                            <input matInput formControlName="degree" placeholder="Bachelor of Science">
                            <mat-error *ngIf="edu.get('degree')?.invalid">Degree is required</mat-error>
                        </mat-form-field>
                    </div>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description" rows="3"
                            placeholder="Major in CS, Minor in Math..."></textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>
    </div>

    <div class="actions">
        <button mat-stroked-button color="primary" (click)="addEducation()" type="button">
            <mat-icon>add</mat-icon> Add Education
        </button>
    </div>
</form>
