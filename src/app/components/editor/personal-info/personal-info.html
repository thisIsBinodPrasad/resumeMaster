<form [formGroup]="form" class="personal-info-form">
  <mat-card class="section-card">
    <mat-card-header>
      <mat-card-title>Personal Details</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="fullName" placeholder="John Doe">
          <mat-error *ngIf="form.get('fullName')?.invalid">Full Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Job Title</mat-label>
          <input matInput formControlName="title" placeholder="Software Engineer">
          <mat-error *ngIf="form.get('title')?.invalid">Job Title is required</mat-error>
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="john@example.com">
          <mat-error *ngIf="form.get('email')?.invalid">Valid email is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" placeholder="+1 234 567 8900">
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline" class="flex-grow">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" placeholder="New York, NY">
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 150px; margin-left: 10px;">
          <mat-label>Zip Code</mat-label>
          <input matInput formControlName="zipCode" placeholder="10001">
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>LinkedIn URL</mat-label>
          <input matInput formControlName="linkedin" placeholder="https://linkedin.com/in/johndoe">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Website / Portfolio</mat-label>
          <input matInput formControlName="website" placeholder="https://johndoe.com">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Professional Summary</mat-label>
        <textarea matInput formControlName="summary" rows="4"
          placeholder="Brief summary of your professional background..."></textarea>
      </mat-form-field>
    </mat-card-content>
  </mat-card>
</form>
