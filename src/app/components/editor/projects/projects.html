<form [formGroup]="form" class="projects-form">
    <div formArrayName="projects">
        <div *ngFor="let proj of projectsArray.controls; let i=index" [formGroupName]="i" class="project-item">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>Project #{{i + 1}}</mat-card-title>
                    <button mat-icon-button color="warn" (click)="removeProject(i)" type="button">
                        <mat-icon>delete</mat-icon>
                    </button>
                </mat-card-header>
                <mat-card-content>
                    <div class="row">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Project Name</mat-label>
                            <input matInput formControlName="name" placeholder="Portfolio Website">
                        </mat-form-field>

                        <mat-form-field appearance="outline">
                            <mat-label>Link (URL)</mat-label>
                            <input matInput formControlName="link" placeholder="https://github.com/my/project">
                        </mat-form-field>
                    </div>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Technologies (Comma separated)</mat-label>
                        <input matInput formControlName="technologies" placeholder="Angular, Node.js, Firebase">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description" rows="3"
                            placeholder="A web application for..."></textarea>
                    </mat-form-field>
                </mat-card-content>
            </mat-card>
        </div>
    </div>

    <div class="actions">
        <button mat-stroked-button color="primary" (click)="addProject()" type="button">
            <mat-icon>add</mat-icon> Add Project
        </button>
    </div>
</form>
